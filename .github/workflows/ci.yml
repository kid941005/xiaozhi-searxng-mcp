name: Lint & syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的连续推送只保留最新一次，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: 语法检查
        run: python -m compileall -q search_mcp bridge.py

      - name: Ruff 静态检查
        run: ruff check search_mcp/search_mcp.py bridge.py || true

      - name: 冒烟测试（工具注册 + 结果格式化 + 错误降级）
        env:
          SEARXNG_URL: http://127.0.0.1:9   # 故意不可达，验证优雅降级
          SEARXNG_TIMEOUT: '3'
        run: python tests/smoke_test.py
